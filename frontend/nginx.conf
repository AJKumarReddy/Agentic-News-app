# Internal nginx for the frontend container: serves the SPA build.
# The public-facing reverse proxy (nginx service / Hostinger) sits in front.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers for the SPA. CSP allows Guardian media (thumbnails)
    # and same-origin/api connections; adjust connect-src for split domains.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://media.guim.co.uk https://i.guim.co.uk data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://api.mydomain.com; frame-ancestors 'none'" always;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: client-side routing (including /article/<slashes>)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
