# Internal nginx for the frontend container: serves the SPA build.
# The public-facing reverse proxy (ALB / Hostinger) sits in front.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers for the SPA. CSP allows publisher media (thumbnails)
    # and same-origin API calls.
    #
    # img-src must list every publisher image host we render. Vite's dev
    # server sends no CSP, so a missing host here fails only once deployed —
    # static01.nyt.com was the omission that blanked every NYT thumbnail in
    # the cloud while they rendered fine locally. Add the host here whenever
    # a new source is added to backend/app/sources/.
    #
    # connect-src is 'self' because the API is same-origin in every supported
    # setup: the ALB routes /api/* to the backend, and locally the /api
    # location below proxies it. A split-domain deployment must add its API
    # origin here or the browser blocks every request the app makes.
    #
    # These are repeated in each location block below. nginx inherits
    # add_header from the parent level ONLY when the child declares none, so a
    # block that sets its own Cache-Control silently drops every one of these —
    # which is how /assets/ came to serve the app's JS and CSS with no nosniff
    # and no CSP at all.
    # media-src carries blob: because answer playback fetches audio from
    # /api/audio/speech and hands the Blob to an <audio> element. Without it
    # the element is blocked — and only in a deployment, since the Vite dev
    # server sends no CSP at all, exactly like the static01.nyt.com omission
    # described above.
    set $csp "default-src 'self'; img-src 'self' https://media.guim.co.uk https://i.guim.co.uk https://static01.nyt.com data:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'";

    # TLS terminates at the proxy in front, so this response leaves over plain
    # HTTP — the header still reaches the browser over HTTPS, which is where it
    # applies. Browsers ignore it on a plain-HTTP page, so local dev is
    # unaffected. No `preload`: that is a one-way commitment covering every
    # subdomain and should be a deliberate act.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # microphone=(self) — not the empty list the others use: asking a question
    # out loud calls getUserMedia on this origin, and an empty allowlist makes
    # that reject before the browser ever offers the permission prompt. Camera
    # and geolocation stay closed; nothing here uses them.
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy $csp always;

    # Local Docker Compose: the SPA is built with VITE_API_BASE_URL=/api, and
    # without this every API call would fall through to the SPA rewrite below
    # and return index.html — which is why `docker compose up` produced a
    # frontend that could not talk to its own backend.
    #
    # In ECS this location is never reached: the ALB matches /api/* first and
    # forwards straight to the backend target group. `backend` does not resolve
    # there, so proxy_pass goes through a variable — that defers the lookup to
    # request time and keeps nginx from failing to start on a name it will
    # never need.
    location /api/ {
        # A spoken question is uploaded as one body. nginx defaults to 1m and
        # would answer 413 itself, before the backend's own per-path ceiling
        # ever ran — keep this at or above STT_MAX_BYTES.
        client_max_body_size 8m;
        resolver 127.0.0.11 valid=10s ipv6=off;  # Docker's embedded DNS
        set $upstream http://backend:8000;
        proxy_pass $upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /api/chat streams Server-Sent Events; buffering holds the whole
        # answer back and delivers it in one lump when the stream closes
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        add_header Content-Security-Policy $csp always;
    }

    # SPA fallback: client-side routing (including /article/<slashes>)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
