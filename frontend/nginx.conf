# Internal nginx for the frontend container: serves the SPA build.
# The public-facing reverse proxy (nginx service / Hostinger) sits in front.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: client-side routing (including /article/<slashes>)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
