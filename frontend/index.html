<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- the mobile top bar is ink-900 in both themes, so one colour covers both -->
    <meta name="theme-color" content="#0b1b44" />
    <!-- the mark is a raster crop of the brand sheet, so it ships as PNG
         rather than the SVG that used to draw it -->
    <link rel="icon" type="image/png" sizes="256x256" href="/source-icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Source — Ask. Research. Verify.</title>
    <!-- names no publisher: the active set is whichever API keys are
         configured, so an enumerated list goes stale on the next change -->
    <meta name="description" content="Stay informed with answers grounded in trusted news reporting, with citations supporting every claim." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
