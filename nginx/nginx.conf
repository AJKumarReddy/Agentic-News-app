# ──────────────────────────────────────────────────────────────────────
# Production reverse proxy for Guardian AI News Assistant (AWS EC2).
#
# Two deployment layouts are supported:
#
#   A) Split hosting (recommended with Hostinger):
#      - React build hosted on Hostinger at  https://mydomain.com
#      - This nginx serves only               https://api.mydomain.com
#
#   B) All-on-AWS:
#      - This nginx serves the frontend AND /api on https://mydomain.com
#
# Replace mydomain.com / api.mydomain.com with your real domain.
# Certificates are issued by certbot (see README / scripts/setup-ec2.sh).
# ──────────────────────────────────────────────────────────────────────

# Redirect all HTTP → HTTPS (and serve the ACME challenge for certbot)
server {
    listen 80;
    server_name api.mydomain.com mydomain.com www.mydomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── API — api.mydomain.com ────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name api.mydomain.com;

    ssl_certificate     /etc/letsencrypt/live/api.mydomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.mydomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE streaming: no buffering, long read timeout
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        return 404;
    }
}

# ── Option B: frontend + API on one domain ────────────────────────────
# Enable this block (and DNS A record for mydomain.com → EC2) if you host
# everything on AWS instead of serving the React build from Hostinger.
server {
    listen 443 ssl;
    http2 on;
    server_name mydomain.com www.mydomain.com;

    ssl_certificate     /etc/letsencrypt/live/mydomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mydomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
