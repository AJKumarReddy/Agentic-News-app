# Build both images, push them to Amazon ECR, and deploy both ECS Fargate
# services on every push to main.
#
# This app has TWO of everything — a backend service (FastAPI :8000) and a
# frontend service (nginx SPA :80) — so the deploy job runs as a matrix over
# the two task definitions rather than the single-service starter layout.
#
# Required GitHub secrets:
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY  — deployer IAM user
# (Prefer OIDC: replace both with `role-to-assume` and drop the long-lived key.)
#
# The deployer principal needs: ecr:GetAuthorizationToken, ecr:BatchCheckLayerAvailability,
# ecr:InitiateLayerUpload, ecr:UploadLayerPart, ecr:CompleteLayerUpload, ecr:PutImage,
# sts:GetCallerIdentity, ecs:RegisterTaskDefinition, ecs:DescribeServices,
# ecs:UpdateService, and iam:PassRole for guardianEcsExecutionRole + guardianEcsTaskRole.
#
# Infrastructure setup (VPC, RDS, ElastiCache, SSM, IAM, ALB, services) and the
# exact deployer IAM policy: aws/ECS_PIPELINE.md.

name: Deploy to Amazon ECS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  AWS_REGION: us-east-2
  ECS_CLUSTER: guardian-cluster
  # Same-origin deployment behind one ALB. Override for split domains.
  VITE_API_BASE_URL: /api

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test suite
    uses: ./.github/workflows/test.yml

  deploy:
    name: Deploy ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: test
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            ecr_repository: guardian-backend
            ecs_service: guardian-backend
            task_definition: aws/taskdef-backend.json
            container_name: backend
            build_context: ./backend
            build_args: ""
          - name: frontend
            ecr_repository: guardian-frontend
            ecs_service: guardian-frontend
            task_definition: aws/taskdef-frontend.json
            container_name: frontend
            build_context: ./frontend
            build_args: "--build-arg VITE_API_BASE_URL=/api"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ matrix.ecr_repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build ${{ matrix.build_args }} \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            ${{ matrix.build_context }}
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # The committed task definitions keep <ACCOUNT_ID> out of the repo; resolve
      # it from the deploy credentials rather than storing it as another secret.
      - name: Resolve account id in the task definition
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          sed -i "s/<ACCOUNT_ID>/$ACCOUNT_ID/g" ${{ matrix.task_definition }}

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ matrix.task_definition }}
          container-name: ${{ matrix.container_name }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ matrix.ecs_service }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
