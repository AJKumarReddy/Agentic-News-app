# AWS CodeBuild spec — builds both Docker images, pushes them to Amazon ECR,
# and emits the image definition files consumed by the CodePipeline ECS deploy
# actions (one per service).
#
# CodeBuild project requirements:
#   - Environment: Amazon Linux 2023 standard image, PRIVILEGED MODE ON (Docker)
#   - Service role: ecr:GetAuthorizationToken, ecr:BatchCheckLayerAvailability,
#     ecr:PutImage, ecr:InitiateLayerUpload, ecr:UploadLayerPart,
#     ecr:CompleteLayerUpload, sts:GetCallerIdentity
#
# Nothing here is account- or region-specific: AWS_DEFAULT_REGION is supplied by
# CodeBuild, AWS_ACCOUNT_ID is resolved from the build's own credentials unless
# it is set as a project environment variable. No secrets are read or baked into
# the images — runtime configuration comes from SSM at task start.

version: 0.2

env:
  variables:
    BACKEND_REPOSITORY: guardian-backend
    FRONTEND_REPOSITORY: guardian-frontend
    # Must match the container names inside aws/taskdef-*.json
    BACKEND_CONTAINER: backend
    FRONTEND_CONTAINER: frontend
    # /api works when frontend and backend share one ALB domain.
    # Override with https://api.example.com/api for a split-domain setup.
    VITE_API_BASE_URL: /api

phases:
  pre_build:
    commands:
      - AWS_ACCOUNT_ID="${AWS_ACCOUNT_ID:-$(aws sts get-caller-identity --query Account --output text)}"
      - ECR_REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
      # Immutable tag: the exact commit CodePipeline pulled. Falls back to a
      # timestamp for manual builds started outside the pipeline.
      - IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:-manual-$(date -u +%Y%m%d%H%M%S)}"
      - echo "Building $IMAGE_TAG into $ECR_REGISTRY"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

  build:
    commands:
      - docker build -t "$ECR_REGISTRY/$BACKEND_REPOSITORY:$IMAGE_TAG" -t "$ECR_REGISTRY/$BACKEND_REPOSITORY:latest" ./backend
      - docker build --build-arg VITE_API_BASE_URL="$VITE_API_BASE_URL" -t "$ECR_REGISTRY/$FRONTEND_REPOSITORY:$IMAGE_TAG" -t "$ECR_REGISTRY/$FRONTEND_REPOSITORY:latest" ./frontend

  post_build:
    commands:
      # post_build runs even when build failed — never push or deploy a bad build
      - if [ "$CODEBUILD_BUILD_SUCCEEDING" != "1" ]; then echo "Build phase failed; skipping push."; exit 1; fi
      - docker push "$ECR_REGISTRY/$BACKEND_REPOSITORY:$IMAGE_TAG"
      - docker push "$ECR_REGISTRY/$BACKEND_REPOSITORY:latest"
      - docker push "$ECR_REGISTRY/$FRONTEND_REPOSITORY:$IMAGE_TAG"
      - docker push "$ECR_REGISTRY/$FRONTEND_REPOSITORY:latest"
      # ECS deploy actions roll out the immutable tag, never :latest
      - printf '[{"name":"%s","imageUri":"%s"}]' "$BACKEND_CONTAINER"  "$ECR_REGISTRY/$BACKEND_REPOSITORY:$IMAGE_TAG"  > imagedefinitions-backend.json
      - printf '[{"name":"%s","imageUri":"%s"}]' "$FRONTEND_CONTAINER" "$ECR_REGISTRY/$FRONTEND_REPOSITORY:$IMAGE_TAG" > imagedefinitions-frontend.json
      - cat imagedefinitions-backend.json imagedefinitions-frontend.json

artifacts:
  files:
    - imagedefinitions-backend.json
    - imagedefinitions-frontend.json
